<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Aire de Mar · Equipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;700&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>

<section class="login" id="v-login" hidden>
  <form id="f-login" autocomplete="on">
    <div class="marca">
      <div class="ola">Deportes · comunidad · mar</div>
      <h1>AIRE DE MAR</h1>
      <p>Espacio del equipo</p>
    </div>
    <label class="f"><span>Usuario</span><input id="l-usuario" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label class="f"><span>Contraseña</span><input id="l-pass" name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit" id="l-entrar">Entrar</button>
    <div class="msg-error" id="l-error" role="alert"></div>
  </form>
</section>

<div id="v-app" hidden>
  <header class="top">
    <div class="fila">
      <div class="brand"><b>AIRE DE MAR</b><span>Equipo</span></div>
      <div class="yo"><span id="yo-nombre"></span><button class="btn quiet small" id="b-cuenta">Mi contraseña</button><button class="btn quiet small" id="b-salir">Salir</button></div>
    </div>
    <nav class="nav" role="tablist">
      <button role="tab" data-tab="produccion" aria-selected="true">Producción</button>
      <button role="tab" data-tab="calendario" aria-selected="false">Calendario</button>
      <button role="tab" data-tab="sponsors" aria-selected="false" id="t-sponsors">Sponsors</button>
      <button role="tab" data-tab="metricas" aria-selected="false">Métricas</button>
      <button role="tab" data-tab="equipo" aria-selected="false" id="t-equipo" hidden>Equipo</button>
    </nav>
  </header>
  <main>
    <div class="aviso" id="aviso" hidden></div>
    <section id="v-produccion"></section>
    <section id="v-calendario" hidden></section>
    <section id="v-sponsors" hidden></section>
    <section id="v-metricas" hidden></section>
    <section id="v-equipo" hidden></section>
  </main>
</div>

<div class="velo" id="velo" hidden></div>
<aside class="ficha" id="ficha" hidden aria-label="Ficha de empresa"></aside>

<dialog id="d-nota"><form id="f-nota" method="dialog"></form></dialog>
<dialog id="d-cuenta">
  <form id="f-cuenta" method="dialog">
    <h3>Cambiar mi contraseña</h3>
    <label class="f"><span>Contraseña nueva (mínimo 8 caracteres)</span><input id="c-pass1" type="password" autocomplete="new-password" minlength="8" required></label>
    <label class="f"><span>Repetila</span><input id="c-pass2" type="password" autocomplete="new-password" minlength="8" required></label>
    <div class="msg-error" id="c-error" role="alert"></div>
    <div class="acciones"><button class="btn" type="submit">Guardar</button><button class="btn quiet" type="button" id="c-cancelar">Cancelar</button></div>
  </form>
</dialog>
<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
